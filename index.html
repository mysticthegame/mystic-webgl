<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Mystic — WebGL offline slice (2026-11-15)</title>
    <style>body { padding: 0; margin: 0; background: #0c0c0d }
#unity-container { position: absolute }
#unity-container.unity-desktop { left: 50%; top: 50%; transform: translate(-50%, -50%) }
#unity-container.unity-mobile { position: fixed; width: 100%; height: 100% }
#unity-canvas { background: #1F1F20 }
.unity-mobile #unity-canvas { width: 100%; height: 100% }
#unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none }
#unity-logo { width: 154px; height: 60px; color: #ddd; font-family: arial; font-size: 28px; text-align: center; line-height: 60px }
#unity-progress-bar-empty { width: 141px; height: 18px; margin-top: 10px; margin-left: 6.5px; background: #444 }
#unity-progress-bar-full { width: 0%; height: 18px; margin-top: 10px; background: #ddd }
#unity-footer { position: relative }
.unity-mobile #unity-footer { display: none }
#unity-build-title { float: right; margin-right: 10px; line-height: 38px; font-family: arial; font-size: 18px; color: #ddd }
#unity-fullscreen-button { cursor:pointer; float: right; width: 38px; height: 38px; background: #444; color:#ddd; font-family:arial; font-size:20px; text-align:center; line-height:38px }
#unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none }
</style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">Mystic</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button">&#x26F6;</div>
        <div id="unity-build-title">Mystic</div>
      </div>
      <div style="font-family:arial;font-size:12px;color:#888;margin-top:6px">Mystic — WebGL offline slice · built 2026-11-15 · BUILD_PASS · 19 scenes · first load downloads ~210 MB · use the &ldquo;Play offline — this device only&rdquo; button in game</div>
    </div>
    <script src="site.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var DATA_PARTS = [
        "site.data.part00", "site.data.part01", "site.data.part02", "site.data.part03",
        "site.data.part04", "site.data.part05", "site.data.part06", "site.data.part07"
      ];
      var CODE_PARTS = [ "site.wasm.part00", "site.wasm.part01" ];
      var TOTAL_PARTS = DATA_PARTS.length + CODE_PARTS.length;
      var doneParts = 0;

      var config = {
        arguments: [],
        dataUrl: null, /* set to a blob URL below, before the loader runs */
        frameworkUrl: "site.framework.js",
        codeUrl: null, /* set to a blob URL below, before the loader runs */
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Rosebud Studios",
        productName: "Mystic",
        productVersion: "0.1.0-slice",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      async function fetchPartsBlob(urls, type) {
        var blobs = [];
        for (var i = 0; i < urls.length; i++) {
          var r = await fetch(urls[i]);
          if (!r.ok) throw new Error("Download failed (" + r.status + ") for " + urls[i]);
          blobs.push(await r.blob());
          doneParts++;
          document.querySelector("#unity-progress-bar-full").style.width = (90 * doneParts / TOTAL_PARTS) + "%";
        }
        return URL.createObjectURL(new Blob(blobs, { type: type }));
      }
      (async () => {
        try {
          config.dataUrl = await fetchPartsBlob(DATA_PARTS, "application/octet-stream");
          config.codeUrl = await fetchPartsBlob(CODE_PARTS, "application/wasm");
          var unityInstance = await createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          });
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        } catch (message) {
          unityShowBanner("Mystic failed to load: " + message, "error");
        }
      })();
    </script>
  </body>
</html>
